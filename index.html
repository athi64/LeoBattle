<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>LeoBattle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- LOADING SCREEN -->

    <section id="loadingScreen" class="screen">

        <div class="lion">🦁</div>

        <h1>LEOBATTLE</h1>

        <p>ENTER THE BATTLE</p>

        <div class="loading-box">
            <div id="loadingBar"></div>
        </div>

        <div id="loadingText">Loading 0%</div>

    </section>


    <!-- LOGIN SCREEN -->

    <section id="loginScreen" class="screen hidden">

        <div class="login-card">

            <div class="small-logo">🦁</div>

            <h1>LEOBATTLE</h1>

            <p class="subtitle">
                Create your legend
            </p>

            <button class="login-btn google"
                    onclick="loginWithGoogle()">
                🌐 Continue with Google
            </button>

            <button class="login-btn facebook"
                    onclick="loginWithFacebook()">
                f&nbsp;&nbsp; Continue with Facebook
            </button>

            <div class="or">
                <span></span>
                OR
                <span></span>
            </div>

            <button class="guest-btn"
                    onclick="continueAsGuest()">
                🎮 Continue as Guest
            </button>

            <p class="login-note">
                By continuing, you agree to LeoBattle terms.
            </p>

        </div>

    </section>


    <!-- LOBBY -->

    <section id="lobbyScreen" class="screen hidden">

        <header class="top">

            <div class="logo">
                🦁 LeoBattle
            </div>

            <div class="player">

                <div>
                    <b id="playerName">Guest</b>
                    <small id="playerId">ID: 000000</small>
                </div>

                <div class="avatar">
                    👤
                </div>

            </div>

        </header>


        <main class="lobby">

            <div class="hero">

                <p>WELCOME</p>

                <h1 id="welcomeName">
                    READY FOR BATTLE?
                </h1>

                <div class="character-preview">
                    🦁
                </div>

                <h2>LEO</h2>

                <button class="start-btn"
                        onclick="startBattle()">
                    ⚔️ START BATTLE
                </button>

            </div>


            <div class="quick-menu">

                <button onclick="openMenu('character')">
                    👤
                    <span>Character</span>
                </button>

                <button onclick="openMenu('weapons')">
                    🔫
                    <span>Weapons</span>
                </button>

                <button onclick="openMenu('maps')">
                    🗺️
                    <span>Maps</span>
                </button>

                <button onclick="openMenu('inventory')">
                    🎒
                    <span>Inventory</span>
                </button>

                <button onclick="openMenu('settings')">
                    ⚙️
                    <span>Settings</span>
                </button>

            </div>

        </main>


        <footer>
            💎 500 &nbsp;&nbsp; 🪙 1000
        </footer>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
