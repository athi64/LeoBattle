<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>LeoBattle</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="game">

    <!-- =====================================
         FIRST LOADING SCREEN
    ====================================== -->

    <section id="firstLoading" class="page active">

        <div class="loading-content">

            <div class="lion-logo">🦁</div>

            <h1>LEOBATTLE</h1>

            <p class="loading-subtitle">
                RISE • FIGHT • CONQUER
            </p>

            <div class="loading-bar">
                <div id="firstBar"></div>
            </div>

            <div id="firstPercent">0%</div>

            <p id="firstStatus">
                STARTING LEOBATTLE...
            </p>

        </div>

    </section>


    <!-- =====================================
         LOGIN SCREEN
    ====================================== -->

    <section id="loginPage" class="page">

        <div class="login-container">

            <div class="login-logo">🦁</div>

            <h1>LEOBATTLE</h1>

            <p>CREATE YOUR LEGEND</p>


            <button class="google-btn"
                    onclick="loginGoogle()">

                <span>G</span>
                CONTINUE WITH GOOGLE

            </button>


            <button class="facebook-btn"
                    onclick="loginFacebook()">

                <span>f</span>
                CONTINUE WITH FACEBOOK

            </button>


            <div class="divider">

                <span></span>

                OR

                <span></span>

            </div>


            <button class="guest-btn"
                    onclick="loginGuest()">

                🎮 CONTINUE AS GUEST

            </button>


            <button class="signup-btn"
                    onclick="openSignup()">

                CREATE NEW ACCOUNT

            </button>


            <p class="terms">
                By continuing, you agree to LeoBattle Terms.
            </p>

        </div>

    </section>


    <!-- =====================================
         SECOND LOADING SCREEN
    ====================================== -->

    <section id="secondLoading" class="page">

        <div class="second-loading">

            <div class="lion-ring">
                🦁
            </div>

            <h1>LEOBATTLE</h1>

            <div class="loading-bar">

                <div id="secondBar"></div>

            </div>

            <div id="secondPercent">
                0%
            </div>

            <p id="secondStatus">
                PREPARING BATTLEFIELD...
            </p>

        </div>

    </section>


    <!-- =====================================
         MAIN LOBBY
    ====================================== -->

    <section id="lobby" class="page">

        <header class="top-bar">

            <div class="brand">
                🦁 <b>LEOBATTLE</b>
            </div>


            <div class="player-info">

                <div>

                    <b id="playerName">
                        Guest
                    </b>

                    <small id="playerId">
                        ID: 000000
                    </small>

                </div>

                <div class="avatar">
                    👤
                </div>

            </div>


            <div class="currency">

                <div class="diamond">
                    ◆
                    <span id="diamondValue">
                        500
                    </span>
                </div>

                <div class="gold">
                    🪙
                    <span id="goldValue">
                        1000
                    </span>
                </div>

            </div>

        </header>


        <main class="lobby-main">


            <!-- CHARACTER -->

            <div class="character-area">

                <div class="character-placeholder">
                    🦁
                </div>

                <h2>LEO</h2>

                <p>LEVEL 1</p>

            </div>


            <!-- MENU -->

            <div class="lobby-menu">

                <button onclick="openFeature('CHARACTER')">
                    👤
                    <span>CHARACTER</span>
                </button>


                <button onclick="openFeature('WEAPONS')">
                    🔫
                    <span>WEAPONS</span>
                </button>


                <button onclick="openFeature('MAPS')">
                    🗺️
                    <span>MAPS</span>
                </button>


                <button onclick="openFeature('MISSIONS')">
                    🎯
                    <span>MISSIONS</span>
                </button>


                <button onclick="openFeature('INVENTORY')">
                    🎒
                    <span>INVENTORY</span>
                </button>


                <button onclick="openFeature('SETTINGS')">
                    ⚙️
                    <span>SETTINGS</span>
                </button>

            </div>


            <!-- BATTLE PANEL -->

            <div class="battle-panel">

                <p>BATTLE MODE</p>

                <h2>CLASSIC</h2>

                <span>
                    RANDOM MAP
                </span>


                <button class="start-button"
                        onclick="startBattle()">

                    START

                    <small>
                        DROP INTO BATTLE
                    </small>

                </button>

            </div>

        </main>

    </section>

</div>


<!-- =====================================
     JAVASCRIPT
====================================== -->

<script>

(function () {

    "use strict";


    /* =================================
       SCREEN SYSTEM
    ================================= */

    function showScreen(screenId) {

        var screens =
            document.querySelectorAll(".page");

        for (var i = 0; i < screens.length; i++) {

            screens[i].classList.remove("active");

        }

        var target =
            document.getElementById(screenId);

        if (target) {

            target.classList.add("active");

        }

    }


    /* =================================
       FIRST LOADING
    ================================= */

    var firstProgress = 0;

    var firstBar =
        document.getElementById("firstBar");

    var firstPercent =
        document.getElementById("firstPercent");

    var firstStatus =
        document.getElementById("firstStatus");


    var firstTimer = setInterval(function () {

        firstProgress += 2;


        if (firstProgress > 100) {

            firstProgress = 100;

        }


        firstBar.style.width =
            firstProgress + "%";


        firstPercent.innerHTML =
            firstProgress + "%";


        if (firstProgress < 20) {

            firstStatus.innerHTML =
                "STARTING LEOBATTLE...";

        }

        else if (firstProgress < 40) {

            firstStatus.innerHTML =
                "LOADING GAME SYSTEM...";

        }

        else if (firstProgress < 60) {

            firstStatus.innerHTML =
                "LOADING CHARACTER SYSTEM...";

        }

        else if (firstProgress < 80) {

            firstStatus.innerHTML =
                "PREPARING BATTLE SYSTEM...";

        }

        else if (firstProgress < 100) {

            firstStatus.innerHTML =
                "ALMOST READY...";

        }

        else {

            firstStatus.innerHTML =
                "WELCOME TO LEOBATTLE";

        }


        if (firstProgress >= 100) {

            clearInterval(firstTimer);


            setTimeout(function () {

                showScreen("loginPage");

            }, 900);

        }


    }, 60);


    /* =================================
       GOOGLE LOGIN
    ================================= */

    window.loginGoogle = function () {

        startSecondLoading("Google Player");

    };


    /* =================================
       FACEBOOK LOGIN
    ================================= */

    window.loginFacebook = function () {

        startSecondLoading("Facebook Player");

    };


    /* =================================
       GUEST LOGIN
    ================================= */

    window.loginGuest = function () {


        var guestID =
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        var guestName =
            "Guest_" + guestID;


        document.getElementById(
            "playerName"
        ).innerHTML = guestName;


        document.getElementById(
            "playerId"
        ).innerHTML =
            "ID: " + guestID;


        startSecondLoading(guestName);

    };


    /* =================================
       SIGN UP
    ================================= */

    window.openSignup = function () {

        alert(
            "LEOBATTLE ACCOUNT\n\n" +
            "Sign Up system will be connected next."
        );

    };


    /* =================================
       SECOND LOADING
    ================================= */

    function startSecondLoading(playerName) {


        showScreen("secondLoading");


        var secondProgress = 0;


        var secondBar =
            document.getElementById(
                "secondBar"
            );


        var secondPercent =
            document.getElementById(
                "secondPercent"
            );


        var secondStatus =
            document.getElementById(
                "secondStatus"
            );


        secondBar.style.width = "0%";

        secondPercent.innerHTML = "0%";


        var secondTimer =
            setInterval(function () {


                secondProgress += 2;


                if (secondProgress > 100) {

                    secondProgress = 100;

                }


                secondBar.style.width =
                    secondProgress + "%";


                secondPercent.innerHTML =
                    secondProgress + "%";


                if (secondProgress < 20) {

                    secondStatus.innerHTML =
                        "CONNECTING PLAYER...";

                }

                else if (secondProgress < 40) {

                    secondStatus.innerHTML =
                        "LOADING PLAYER DATA...";

                }

                else if (secondProgress < 60) {

                    secondStatus.innerHTML =
                        "LOADING CHARACTER...";

                }

                else if (secondProgress < 80) {

                    secondStatus.innerHTML =
                        "PREPARING BATTLEFIELD...";

                }

                else if (secondProgress < 100) {

                    secondStatus.innerHTML =
                        "ENTERING LOBBY...";

                }

                else {

                    secondStatus.innerHTML =
                        "LEOBATTLE READY";

                }


                if (secondProgress >= 100) {


                    clearInterval(secondTimer);


                    setTimeout(function () {

                        showScreen("lobby");

                    }, 900);

                }


            }, 60);

    }


    /* =================================
       LOBBY MENU
    ================================= */

    window.openFeature = function (feature) {

        alert(
            feature +
            "\n\nComing Soon 🔥"
        );

    };


    /* =================================
       START BATTLE
    ================================= */

    window.startBattle = function () {

        alert(
            "🪂 DROP INTO BATTLE\n\n" +
            "Battle system coming next!"
        );

    };


})();

</script>

</body>
                </html>
