<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeoBattle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <header class="top-bar">
            <div class="logo">
                🦁 <span>LeoBattle</span>
            </div>

            <div class="currency">
                <div>💎 <span id="diamonds">500</span></div>
                <div>🪙 <span id="gold">1000</span></div>
            </div>
        </header>

        <main class="lobby">

            <div class="welcome">
                <p>WELCOME TO</p>
                <h1>LEOBATTLE</h1>
                <span>Enter the Battle. Create Your Legend.</span>
            </div>

            <div class="character-box">
                <div class="character">
                    🦁
                </div>

                <h2 id="characterName">Leo</h2>
                <p>Level 1 • Rookie</p>

                <button onclick="createCharacter()">
                    👤 CREATE CHARACTER
                </button>
            </div>

            <button class="start-button" onclick="startBattle()">
                ⚔️ START BATTLE
            </button>

            <div class="menu">

                <button onclick="openPage('characters')">
                    👥
                    <span>Characters</span>
                </button>

                <button onclick="openPage('weapons')">
                    🔫
                    <span>Weapons</span>
                </button>

                <button onclick="openPage('maps')">
                    🗺️
                    <span>Maps</span>
                </button>

                <button onclick="openPage('settings')">
                    ⚙️
                    <span>Settings</span>
                </button>

            </div>

        </main>

        <footer>
            <span>LeoBattle</span>
            <span>Version 1.0</span>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
