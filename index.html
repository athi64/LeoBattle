<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">

    <title>LeoBattle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- FIRST LOADING -->
    <section id="firstLoading" class="page active">
        <div class="loading-screen">

            <div class="lion">🦁</div>

            <h1>LEOBATTLE</h1>

            <p>RISE • FIGHT • CONQUER</p>

            <div class="loading-box">
                <div id="firstBar"></div>
            </div>

            <div id="firstPercent">0%</div>

            <small id="firstStatus">
                INITIALIZING BATTLE SYSTEM...
            </small>

        </div>
    </section>


    <!-- LOGIN -->
    <section id="loginPage" class="page">

        <div class="login-screen">

            <div class="lion small">🦁</div>

            <h1>LEOBATTLE</h1>
            <p>CREATE YOUR LEGEND</p>

            <button onclick="loginGoogle()" class="login-btn google">
                🌐 CONTINUE WITH GOOGLE
            </button>

            <button onclick="loginFacebook()" class="login-btn facebook">
                f &nbsp; CONTINUE WITH FACEBOOK
            </button>

            <div class="or">OR</div>

            <button onclick="loginGuest()" class="login-btn guest">
                🎮 CONTINUE AS GUEST
            </button>

            <button onclick="openSignup()" class="signup">
                CREATE NEW ACCOUNT
            </button>

        </div>

    </section>


    <!-- SECOND LOADING -->
    <section id="secondLoading" class="page">

        <div class="loading-screen">

            <div class="lion-ring">
                🦁
            </div>

            <h1>LEOBATTLE</h1>

            <p>ENTERING BATTLEFIELD</p>

            <div class="loading-box">
                <div id="secondBar"></div>
            </div>

            <div id="secondPercent">0%</div>

            <small id="secondStatus">
                CONNECTING PLAYER...
            </small>

        </div>

    </section>


    <!-- LOBBY -->
    <section id="lobby" class="page">

        <header>

            <div class="logo">
                🦁 LEOBATTLE
            </div>

            <div class="currency">
                <span class="diamond">◆ <b id="diamondValue">500</b></span>
                <span class="gold">● <b id="goldValue">1000</b></span>
            </div>

            <div class="player">
                👤
                <span id="playerName">Guest</span>
                <small id="playerId">ID: 000000</small>
            </div>

        </header>


        <main>

            <div class="character">

                <div class="character-image">
                    🦁
                </div>

                <h2>LEO</h2>
                <p>LEVEL 1</p>

            </div>


            <div class="battle">

                <span>BATTLE MODE</span>
                <h1>CLASSIC</h1>
                <p>RANDOM MAP</p>

                <button onclick="startBattle()" class="start">
                    ⚔ START
                    <small>DROP INTO BATTLE</small>
                </button>

            </div>


            <div class="menu">

                <button onclick="openFeature('CHARACTER')">
                    👤<span>CHARACTER</span>
                </button>

                <button onclick="openFeature('WEAPONS')">
                    🔫<span>WEAPONS</span>
                </button>

                <button onclick="openFeature('MAPS')">
                    🗺️<span>MAPS</span>
                </button>

                <button onclick="openFeature('MISSIONS')">
                    🎯<span>MISSIONS</span>
                </button>

                <button onclick="openFeature('INVENTORY')">
                    🎒<span>INVENTORY</span>
                </button>

                <button onclick="openFeature('SETTINGS')">
                    ⚙️<span>SETTINGS</span>
                </button>

            </div>

        </main>

    </section>

</div>

<script src="script.js"></script>

</body>
    </html>
