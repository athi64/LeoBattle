<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">

    <title>LeoBattle</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div id="game">

        <!-- FIRST LOADING -->
        <section id="firstLoading" class="page active">

            <div class="loading-content">

                <div class="lion-logo">
                    🦁
                </div>

                <h1>LEOBATTLE</h1>

                <p class="loading-subtitle">
                    RISE • FIGHT • CONQUER
                </p>

                <div class="loading-bar">
                    <div id="firstBar"></div>
                </div>

                <div id="firstPercent">0%</div>

                <p id="firstStatus">
                    INITIALIZING BATTLE SYSTEM...
                </p>

            </div>

        </section>


        <!-- LOGIN -->
        <section id="loginPage" class="page">

            <div class="login-container">

                <div class="login-logo">
                    🦁
                </div>

                <h1>LEOBATTLE</h1>

                <p>CREATE YOUR LEGEND</p>

                <button class="google-btn"
                        onclick="loginGoogle()">
                    <span>G</span>
                    CONTINUE WITH GOOGLE
                </button>

                <button class="facebook-btn"
                        onclick="loginFacebook()">
                    <span>f</span>
                    CONTINUE WITH FACEBOOK
                </button>

                <div class="divider">
                    <span></span>
                    OR
                    <span></span>
                </div>

                <button class="guest-btn"
                        onclick="loginGuest()">
                    🎮 CONTINUE AS GUEST
                </button>

                <button class="signup-btn"
                        onclick="openSignup()">
                    CREATE NEW ACCOUNT
                </button>

                <p class="terms">
                    By continuing, you agree to LeoBattle Terms.
                </p>

            </div>

        </section>


        <!-- SECOND LOADING -->
        <section id="secondLoading" class="page">

            <div class="second-loading">

                <div class="lion-ring">
                    🦁
                </div>

                <h1>LEOBATTLE</h1>

                <div class="loading-bar">
                    <div id="secondBar"></div>
                </div>

                <div id="secondPercent">0%</div>

                <p id="secondStatus">
                    PREPARING BATTLEFIELD...
                </p>

            </div>

        </section>


        <!-- MAIN LOBBY -->
        <section id="lobby" class="page">

            <header class="top-bar">

                <div class="brand">
                    🦁 <b>LEOBATTLE</b>
                </div>

                <div class="player-info">

                    <div>
                        <b id="playerName">Guest</b>
                        <small id="playerId">
                            ID: 000000
                        </small>
                    </div>

                    <div class="avatar">
                        👤
                    </div>

                </div>

                <div class="currency">

                    <div class="diamond">
                        ◆ <span id="diamondValue">500</span>
                    </div>

                    <div class="gold">
                        🪙 <span id="goldValue">1000</span>
                    </div>

                </div>

            </header>


            <main class="lobby-main">

                <div class="character-area">

                    <div class="character-placeholder">
                        🦁
                    </div>

                    <h2>LEO</h2>

                    <p>LEVEL 1</p>

                </div>


                <div class="lobby-menu">

                    <button onclick="openFeature('CHARACTER')">
                        👤
                        <span>CHARACTER</span>
                    </button>

                    <button onclick="openFeature('WEAPONS')">
                        🔫
                        <span>WEAPONS</span>
                    </button>

                    <button onclick="openFeature('MAPS')">
                        🗺️
                        <span>MAPS</span>
                    </button>

                    <button onclick="openFeature('MISSIONS')">
                        🎯
                        <span>MISSIONS</span>
                    </button>

                    <button onclick="openFeature('INVENTORY')">
                        🎒
                        <span>INVENTORY</span>
                    </button>

                    <button onclick="openFeature('SETTINGS')">
                        ⚙️
                        <span>SETTINGS</span>
                    </button>

                </div>


                <div class="battle-panel">

                    <p>BATTLE MODE</p>

                    <h2>CLASSIC</h2>

                    <span>RANDOM MAP</span>

                    <button class="start-button"
                            onclick="startBattle()">
                        START
                        <small>DROP INTO BATTLE</small>
                    </button>

                </div>

            </main>

        </section>

    </div>

    <script src="./script.js"></script>

</body>
                </html>
